server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # La web es una SPA: cualquier ruta desconocida devuelve index.html y el router decide.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # configuracion.js lleva la URL de la API y cambia por despliegue: no se cachea.
  location = /configuracion.js {
    add_header Cache-Control "no-store";
  }

  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
