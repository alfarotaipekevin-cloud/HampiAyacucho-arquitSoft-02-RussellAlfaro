# EQ-02 / ADR-007 · Balanceador para dos instancias de la API (perfil "alta-disponibilidad" de docker compose).
# Si una instancia falla o tarda, nginx reintenta la petición en la otra (proxy_next_upstream).
events {}
http {
  upstream api_hampi {
    server api:3000 max_fails=1 fail_timeout=5s;
    server api-2:3000 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://api_hampi;
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_set_header Host $host;
      add_header X-Instancia $upstream_addr always;
    }
  }
}
